name: Auto Format & Update README

on:
  push:
    branches: ["main"]

jobs:
  auto-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto-format Code
        run: |
          pip install ruff
          ruff format .
          ruff check --fix . || true

      - name: Check/Generate README
        run: |
          echo "Checking README file status..."

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code & update docs [skip ci]"
          branch: main