name: Generate Docs & README

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install doc generator
        run: pip install pydoc-markdown mkdocs

      - name: Generate API docs
        run: |
          pydoc-markdown --output README.md src/ 2>/dev/null || \
          echo "Docs generation skipped — no Python modules found"

      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate API documentation [skip ci]"
          branch: main